apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: demo-messages
  namespace: kafka
  labels:
    strimzi.io/cluster: demo-cluster
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000 
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: demo-commands
  namespace: kafka
  labels:
    strimzi.io/cluster: demo-cluster
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: demo-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: demo-cluster
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 259200000 
    cleanup.policy: delete