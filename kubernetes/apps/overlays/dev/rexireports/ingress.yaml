# Tailnet access only. See the prod overlay's ingress.yaml for why funnel is
# deliberately absent.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rexireports-ingress
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  tls:
    - hosts:
        - rexireports-dev
