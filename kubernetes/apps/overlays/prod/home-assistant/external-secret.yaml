# Everything go2rtc needs, expanded at runtime from ${VAR} references in
# go2rtc.yaml -- which is why the ConfigMap itself holds no secret
# material and is safe in Git.
#
# Two Vault paths: the Google OAuth client is shared application-level
# identity, while the grant and the camera credentials are specific to
# this deployment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: home-assistant-secrets
    creationPolicy: Owner
    template:
      data:
        NEST_CLIENT_ID: "{{ .nest_client_id }}"
        NEST_CLIENT_SECRET: "{{ .nest_client_secret }}"
        NEST_REFRESH_TOKEN: "{{ .nest_refresh_token }}"
        NEST_PROJECT_ID: "{{ .nest_project_id }}"
        NEST_DEVICE_DRIVEWAY: "{{ .nest_device_driveway }}"
        NEST_DEVICE_DOORBELL: "{{ .nest_device_doorbell }}"
        NEST_DEVICE_BACKYARD: "{{ .nest_device_backyard }}"
        WANSVIEW_USER: "{{ .wansview_user }}"
        WANSVIEW_PASS: "{{ .wansview_pass }}"
        WANSVIEW_HOST: "{{ .wansview_host }}"
        WEBRTC_CANDIDATE: "{{ .webrtc_candidate }}"
  data:
    - secretKey: nest_client_id
      remoteRef:
        key: secret/gcp-home-assistant
        property: client_id
    - secretKey: nest_client_secret
      remoteRef:
        key: secret/gcp-home-assistant
        property: client_secret
    - secretKey: nest_refresh_token
      remoteRef:
        key: secret/home-assistant-prod
        property: nest_refresh_token
    - secretKey: nest_project_id
      remoteRef:
        key: secret/home-assistant-prod
        property: nest_project_id
    - secretKey: nest_device_driveway
      remoteRef:
        key: secret/home-assistant-prod
        property: nest_device_driveway
    - secretKey: nest_device_doorbell
      remoteRef:
        key: secret/home-assistant-prod
        property: nest_device_doorbell
    - secretKey: nest_device_backyard
      remoteRef:
        key: secret/home-assistant-prod
        property: nest_device_backyard
    - secretKey: wansview_user
      remoteRef:
        key: secret/home-assistant-prod
        property: wansview_user
    - secretKey: wansview_pass
      remoteRef:
        key: secret/home-assistant-prod
        property: wansview_pass
    - secretKey: wansview_host
      remoteRef:
        key: secret/home-assistant-prod
        property: wansview_host
    - secretKey: webrtc_candidate
      remoteRef:
        key: secret/home-assistant-prod
        property: webrtc_candidate
---
# Deliberately its own ExternalSecret. hass_token cannot exist in Vault
# until Home Assistant has been onboarded through its UI and a long-lived
# token generated by hand, so this one will report SecretSyncedError and
# the backend pod will not start until that happens.
#
# That is expected, and it is why it is separated: folding HASS_TOKEN into
# home-assistant-secrets would block go2rtc -- and therefore all video --
# on a P3 artifact.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: home-assistant-backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: home-assistant-backend-secrets
    creationPolicy: Owner
    template:
      data:
        HASS_TOKEN: "{{ .hass_token }}"
  data:
    - secretKey: hass_token
      remoteRef:
        key: secret/home-assistant-prod
        property: hass_token
