# Flask session-signing key for prod, consumed by the Deployment via envFrom.
#
# Session cookies are signed with this key, not encrypted, and every auth check
# in the app is `if 'user_id' not in session` — anyone holding the key can forge
# a session for any user. It never lives in Git or in an image.
#
# Deliberately per-environment rather than shared from base: a key leaked from
# prod must not be usable to forge sessions in the other environment.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: medtracker-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: medtracker-secrets
    creationPolicy: Owner
    template:
      data:
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: secret/medtracker-prod
        property: secret_key
