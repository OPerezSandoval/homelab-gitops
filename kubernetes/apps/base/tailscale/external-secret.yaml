apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth-test
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: operator-oauth-test  # Different name for testing
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: secret/tailscale
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: secret/tailscale
        property: client_secret