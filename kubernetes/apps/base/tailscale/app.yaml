apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argo-gitops
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.78.3
    helm:
      parameters:
        # Reference existing secret instead of hardcoding
        - name: oauth.clientId
          value: "" 
        - name: oauth.clientSecret
          value: "" 
        - name: operatorConfig.hostname
          value: "tailscale-operator"
      values: |
        oauth:
          clientIdFromSecret: true
          clientSecretFromSecret: true
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true