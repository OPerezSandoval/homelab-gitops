apiVersion: apps/v1
kind: Deployment
metadata:
  name: archeflow-site
  labels:
    app: archeflow-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archeflow-site
  template:
    metadata:
      labels:
        app: archeflow-site
    spec:
      containers:
        - name: archeflow-site
          image: operez11/archeflow-site:dev-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
