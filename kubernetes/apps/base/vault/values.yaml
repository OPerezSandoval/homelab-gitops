server:
  # Use injector for secrets
  injector:
    enabled: true
  
  ha:
    enabled: false
  
  # Data storage with NFS
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: nfs-storage  
    accessMode: ReadWriteOnce
  
  # Standalone config
  standalone:
    enabled: true
    config: |
      ui = true
      
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      
      storage "file" {
        path = "/vault/data"
      }
  
  # Service configuration
  service:
    enabled: true
    type: NodePort
    nodePort: 30820
    port: 8200

ui:
  enabled: true
  serviceType: NodePort
  externalPort: 8200