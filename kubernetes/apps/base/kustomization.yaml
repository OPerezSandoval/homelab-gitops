apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ApplicationSets auto-generate Applications by scanning overlays/{dev,prod}/*
  # Add a new workload by creating overlay folders only — no app.yaml needed.
  - applicationsets

  # Exception: n8n is a single-instance Helm chart with no dev/prod split, so it
  # keeps a manual app.yaml rather than a pair of overlay folders.
  - n8n
