# go2rtc stays standalone rather than using Home Assistant's bundled
# instance: HA's managed go2rtc binds its API to 127.0.0.1 inside the HA
# container, so the dashboard could never reach it. Running it separately
# means HA and the dashboard share one instance and one set of camera
# connections.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go2rtc
spec:
  replicas: 1
  # Recreate, not RollingUpdate. With hostNetwork the pod owns ports 1984,
  # 8554 and 8555 on the node, and those are a singleton: a rolling update
  # tries to start the replacement while the old pod still holds them, the
  # new pod sits Pending on "didn't have free ports for the requested pod
  # ports", and maxUnavailable of a single replica rounds to zero so the
  # old one is never evicted. The rollout deadlocks until someone deletes
  # the pod by hand. Same conclusion as the HA Deployment, different
  # reason -- host ports rather than a SQLite file.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: go2rtc }
  template:
    metadata:
      labels: { app: go2rtc }
    spec:
      # WebRTC has to advertise a candidate address a browser can actually
      # reach, which means binding the node's own network. This is why the
      # namespace carries pod-security.kubernetes.io/enforce: privileged.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Pinned deliberately. WEBRTC_CANDIDATE is this node's LAN address,
      # so a pod that rescheduled elsewhere would advertise an address
      # that no longer points at it and every stream would go black with
      # nothing useful in the logs. One node today, but the coupling is
      # real and worth making explicit.
      nodeSelector:
        kubernetes.io/hostname: talos-awp-vxu
      containers:
        - name: go2rtc
          image: alexxit/go2rtc:latest
          envFrom:
            - secretRef: { name: home-assistant-secrets }
          ports:
            - { containerPort: 1984, name: api }
            - { containerPort: 8555, name: webrtc }
          volumeMounts:
            - { name: config, mountPath: /config/go2rtc.yaml, subPath: go2rtc.yaml }
          resources:
            # 512Mi was not enough. go2rtc idles around 200Mi but spikes
            # well past that with four concurrent sessions -- one RTSP and
            # three Nest WebRTC -- and was OOMKilled (exit 137) once the
            # battery camera came back online and made the fourth stream
            # real. The kill is worse than it sounds: on restart the nest:
            # producers re-negotiate, and the consumer's video sender can
            # bind to the wrong H264 receiver, leaving a stream that
            # delivers audio only while the video arrives on a receiver
            # nothing is attached to. The dashboard reports such a tile as
            # "live" because the peer connection did succeed.
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: go2rtc-config }
---
apiVersion: v1
kind: Service
metadata:
  name: go2rtc
spec:
  selector: { app: go2rtc }
  ports:
    - { name: api, port: 1984, targetPort: 1984 }
