# nginx-unprivileged serving the built React bundle. Its config proxies
# exactly two go2rtc paths by exact match -- a prefix proxy would expose
# go2rtc's stream-add and ffmpeg API to anyone who loads the page.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: operez11/home-assistant-frontend
          ports:
            - { containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - { port: 80, targetPort: 8080 }
