apiVersion: apps/v1
kind: Deployment
metadata:
  name: medtracker
  labels:
    app: medtracker
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The database is SQLite on an NFS RWX volume and
  # SQLite's POSIX advisory locking is unreliable over NFS, so two processes
  # holding the same file corrupt it silently rather than failing loudly. A
  # rolling update briefly runs the old and new pods together — that is two
  # writers. Recreate accepts a few seconds of downtime to guarantee one writer.
  # This can go back to RollingUpdate after the migration to Postgres.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: medtracker
  template:
    metadata:
      labels:
        app: medtracker
    spec:
      securityContext:
        # The image (Chainguard python) runs as UID 65532 and has no shell.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup applies to the emptyDir below. It does NOT apply to the data
        # volume: the kubelet skips volume ownership management entirely on NFS,
        # so neither fsGroup nor fsGroupChangePolicy will chown anything there.
        # Files on an NFS PVC that were created by a previous root container stay
        # owned by uid 0, and this container (65532) can read them but not write
        # them. Ownership on NFS is fixed on the NFS server, not from here — the
        # init container below turns that condition into a startup failure
        # instead of letting it become a silent data-loss bug.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Refuse to start rather than start read-only.
      #
      # SQLite opens a read-only database file without complaining and only fails
      # at the first write, so a pod whose data volume it cannot write passes its
      # health check, serves every page correctly, and silently discards every
      # dose the user logs. That happened in prod: the volume's medtrack.db was
      # still owned by uid 0 from the old root image, and the deployment reported
      # Running 1/1 for hours while accepting no writes.
      #
      # Same image as the app container (so the images: transformer keeps them on
      # one tag, and there is nothing extra to pull). The Chainguard image has no
      # shell, so this is Python rather than a shell one-liner.
      initContainers:
      - name: check-data-writable
        image: operez11/medtracker:1.0.4
        imagePullPolicy: IfNotPresent
        command:
          - /usr/bin/python
          - -c
          - |
            import os, sys, stat

            DIR = "/app/instance"
            DB = os.path.join(DIR, "medtrack.db")
            uid = os.getuid()

            problems = []
            if not os.access(DIR, os.W_OK | os.X_OK):
                problems.append("%s is not writable by uid %d" % (DIR, uid))
            if os.path.exists(DB) and not os.access(DB, os.W_OK):
                st = os.stat(DB)
                problems.append(
                    "%s is owned by %d:%d mode %s and is not writable by uid %d"
                    % (DB, st.st_uid, st.st_gid, oct(stat.S_IMODE(st.st_mode)), uid)
                )

            if problems:
                for p in problems:
                    print("FATAL: " + p, file=sys.stderr)
                print(
                    "SQLite would accept reads and fail every write with "
                    "'attempt to write a readonly database'. fsGroup cannot fix "
                    "this: the kubelet skips volume ownership management on NFS. "
                    "Fix it on the NFS server, on this PVC's export directory:\n"
                    "    chown -R 65532:65532 <export>/<namespace>-medtracker-pvc-*",
                    file=sys.stderr,
                )
                sys.exit(1)

            print("ok: %s is writable by uid %d" % (DIR, uid))
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - mountPath: /app/instance
          name: medtracker-data
      containers:
      - name: medtracker
        image: operez11/medtracker:1.0.4
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 5000
          name: http
        envFrom:
          # SECRET_KEY. The app refuses to start without it, so a missing or
          # broken ExternalSecret surfaces as a crash loop rather than as an app
          # silently running with a publicly known session-signing key.
          - secretRef:
              name: medtracker-secrets
        # readinessProbe gates traffic: the Service only sends requests once
        # /health answers. livenessProbe restarts a wedged process. startupProbe
        # gives the app room to boot without the liveness probe killing it first.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
          failureThreshold: 20
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        # Requests move the pod out of BestEffort QoS, where it would be first
        # evicted under memory pressure — a real concern on a single node.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            # No CPU limit on purpose: a limit throttles rather than protects,
            # and the request already guarantees the share. The memory limit is
            # what prevents one leak from taking the node down.
            memory: 512Mi
        volumeMounts:
        - mountPath: /app/instance
          name: medtracker-data
        # readOnlyRootFilesystem means gunicorn needs a writable /tmp.
        - mountPath: /tmp
          name: tmp
      volumes:
      - name: medtracker-data
        persistentVolumeClaim:
          claimName: medtracker
      - name: tmp
        emptyDir: {}
