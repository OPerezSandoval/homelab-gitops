# Flask session-signing key, consumed by the Deployment via envFrom.
#
# Session cookies are signed with this key, not encrypted, and every auth check
# in the app is `if 'user_id' not in session`. Anyone holding the key can forge
# a session for any user, so it must never live in Git or in an image.
#
# Namespace is set by the overlay (medtracker-dev / medtracker-prod), so dev and
# prod each get their own key from their own Vault path.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: medtracker-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: medtracker-secrets
    creationPolicy: Owner
    template:
      data:
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: secret/medtracker
        property: secret_key
