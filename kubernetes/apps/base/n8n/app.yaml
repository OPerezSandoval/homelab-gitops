apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argo-gitops
spec:
  project: default
  source:
    repoURL: oci://8gears.container-registry.com/library/n8n
    targetRevision: "2.0.1"
    chart: n8n
    helm:
      values: |
        main:
          config:
            n8n:
              host: "n8n.balinese-pentatonic.ts.net"
              protocol: "https"
              editor_base_url: "https://n8n.balinese-pentatonic.ts.net"
              webhook_url: "https://n8n.balinese-pentatonic.ts.net"
              trust_proxy: true
              port: 5678
          secret: {}
          extraEnv:
            N8N_ENCRYPTION_KEY:
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_ENCRYPTION_KEY
          persistence:
            enabled: true
            type: dynamic
            storageClass: nfs-storage
            size: 5Gi
            accessModes:
              - ReadWriteOnce
          service:
            type: NodePort
            port: 5678
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        ingress:
          enabled: true
          className: tailscale
          hosts:
            - host: n8n
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - n8n
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true