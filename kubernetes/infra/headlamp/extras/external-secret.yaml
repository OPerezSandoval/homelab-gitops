# OIDC config consumed by the Headlamp chart's externalSecret mode. envFrom loads
# all keys as env; the chart wires OIDC_CLIENT_ID/_CLIENT_SECRET/_ISSUER_URL/_SCOPES
# into -oidc-* args. client_id/client_secret come from Vault (secret/headlamp-oidc);
# issuer + scopes are static (scopes include `groups` for API-server RBAC).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    template:
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
        OIDC_ISSUER_URL: "https://auth.archeflow.com/application/o/headlamp/"
        # offline_access → Authentik issues a refresh token so Headlamp can renew
        # the short-lived id_token it forwards to the API server (without it the
        # session dies at token expiry: "refresh token is not set"). groups →
        # id_token carries group membership for the API-server RBAC binding.
        # Both scopes must ALSO be added as mappings on the Authentik provider,
        # or Authentik silently drops them ("requested scopes not configured").
        OIDC_SCOPES: "openid,profile,email,groups,offline_access"
  data:
    - secretKey: client_id
      remoteRef:
        key: secret/headlamp-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: secret/headlamp-oidc
        property: client_secret
