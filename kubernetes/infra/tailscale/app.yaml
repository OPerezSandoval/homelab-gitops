apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argo-gitops
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.78.3
      helm:
        values: |
          oauth:
            clientIdFromSecret: true
            clientSecretFromSecret: true
          operatorConfig:
            hostname: "tailscale-operator"
          # Exposes the kube-apiserver at tailscale-operator.balinese-pentatonic.ts.net,
          # so kubectl works from any tailnet device without being on the home LAN.
          # "true" = auth mode: requests are impersonated as the calling tailnet identity,
          # which still needs a matching RBAC binding in-cluster and a tailnet ACL grant.
          # Never "noauth" — that would hand full cluster-admin to every tailnet device.
          # https://tailscale.com/kb/1437/kubernetes-operator-api-server-proxy
          apiServerProxyConfig:
            mode: "true"
    - repoURL: https://github.com/OPerezSandoval/homelab-gitops.git
      targetRevision: main
      path: kubernetes/infra/tailscale/extras
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
