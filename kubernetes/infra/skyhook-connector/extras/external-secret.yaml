# Skyhook SaaS API key, consumed by the connector Deployment via secretKeyRef
# (the chart's `existingSecret` value points at this Secret). The key name
# SKYHOOK_API_KEY is fixed by the chart's deployment template.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skyhook-connector-secrets
  namespace: skyhook-connector
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: skyhook-connector-secrets
    creationPolicy: Owner
    template:
      data:
        SKYHOOK_API_KEY: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: secret/skyhook
        property: api-key
