# Cloudflare R2 credentials + the restic repository password.
#
# !!! THE RESTIC PASSWORD MUST ALSO BE HELD OFFLINE !!!
# It lives in Vault, and Vault is one of the things being backed up. If Vault
# is lost, its own backup is unreadable without this password — a restore loop
# that closes on itself. Keep a copy wherever the Vault recovery keys are kept.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: restic-r2
  namespace: backup-offsite
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: restic-r2
    creationPolicy: Owner
    template:
      data:
        RESTIC_REPOSITORY: "{{ .repository }}"
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: repository
      remoteRef:
        key: secret/restic-r2
        property: repository
    - secretKey: password
      remoteRef:
        key: secret/restic-r2
        property: password
    - secretKey: access_key_id
      remoteRef:
        key: secret/restic-r2
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: secret/restic-r2
        property: secret_access_key
