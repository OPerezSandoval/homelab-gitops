apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argo-gitops
spec:
  project: default
  # Single source: the upstream community chart deploying the vanilla demo image
  # (ghcr.io/backstage/backstage). No extras/ yet — this first pass runs the demo
  # with the guest auth provider and the chart's default in-memory SQLite, so it
  # needs no Vault/ESO secret and no CNPG database. Adding Authentik OIDC + a CNPG
  # Postgres cluster (mirroring authentik/) is a deliberate follow-up PR.
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.8.2
    helm:
      valuesObject:
        backstage:
          image:
            registry: ghcr.io
            repository: backstage/backstage
            # Demo image only publishes :latest. Pin to a digest before this is
            # anything more than a prove-out — GitOps wants reproducible tags.
            tag: latest
          # Restore the image's baked base config, which the chart otherwise drops:
          # it sets command: ["node", "packages/backend"], overriding the image CMD
          # ("node packages/backend --config app-config.yaml --config
          # app-config.production.yaml") and taking both --config flags with it.
          # The chart appends "--config <installDir>/app-config-from-configmap.yaml"
          # after these args, so appConfig below still loads last and wins.
          #
          # app-config.yaml carries `app.packages: all` — the declarative plugin
          # discovery. Without it no frontend plugin registers its API, which is
          # what caused "No implementation available for apiRef{plugin.notifications
          # .service}". It also sets backend.database.client: better-sqlite3.
          #
          # app-config.production.yaml is deliberately NOT restored: it pins
          # database.client to pg with ${POSTGRES_HOST}/${POSTGRES_USER} etc, which
          # we don't have. Re-add it in the CNPG follow-up, not before.
          args:
            - "--config"
            - "app-config.yaml"
          # Overlay on top of the baked config — only what the demo gets wrong for
          # our deployment. Everything else (plugins, sqlite, scaffolder) is inherited.
          appConfig:
            app:
              title: Archeflow Backstage
              baseUrl: https://backstage.balinese-pentatonic.ts.net
            organization:
              name: Archeflow
            catalog:
              # Baked paths are ../../examples/* (relative to packages/backend in a
              # dev checkout). From WORKDIR /app that resolves outside the image; the
              # example entities actually live at /app/examples. Repointing here is
              # the half of app-config.production.yaml we do want.
              locations:
                - type: file
                  target: ./examples/entities.yaml
                - type: file
                  target: ./examples/template/template.yaml
                  rules:
                    - allow: [Template]
                - type: file
                  target: ./examples/org.yaml
                  rules:
                    - allow: [User, Group]
            backend:
              baseUrl: https://backstage.balinese-pentatonic.ts.net
              cors:
                origin: https://backstage.balinese-pentatonic.ts.net
            auth:
              environment: development
              providers:
                guest:
                  # Guest sign-in is a dev-only provider; this flag is required for
                  # it to issue identities. Replace with Authentik OIDC before any
                  # real use — guest grants everyone the same identity.
                  dangerouslyAllowOutsideDevelopment: true
        service:
          type: ClusterIP
          ports:
            backend: 7007
        # Tailnet-only admin access, matching repo convention (host resolves to
        # backstage.balinese-pentatonic.ts.net; Tailscale provisions the TLS cert).
        ingress:
          enabled: true
          className: tailscale
          host: backstage
          tls:
            enabled: true
            secretName: backstage-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
