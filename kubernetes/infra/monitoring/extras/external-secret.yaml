# Grafana admin + OIDC client credentials, synced from Vault (secret/grafana-ak).
# Consumed by the Grafana subchart via admin.existingSecret (admin_user /
# admin_password) and envFromSecret (the two GF_AUTH_GENERIC_OAUTH_* keys, which
# override the client_id / client_secret placeholders in grafana.ini).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-secrets
    creationPolicy: Owner
    template:
      data:
        # Local break-glass admin (OIDC is the normal login path).
        admin_user: "admin"
        admin_password: "{{ .admin_password }}"
        # OIDC client credentials issued by Authentik's OAuth2 provider.
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .client_id }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: secret/grafana-ak
        property: admin_password
    - secretKey: client_id
      remoteRef:
        key: secret/grafana-ak
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: secret/grafana-ak
        property: client_secret
