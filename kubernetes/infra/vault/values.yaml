global:
  enabled: true

injector:
  enabled: true

server:
  image:
    repository: "hashicorp/vault"
    tag: "1.17.2"
  
  standalone:
    enabled: true
    config: |
      ui = true
      
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      
      storage "file" {
        path = "/vault/data"
      }
  
  ha:
    enabled: false
  
  service:
    enabled: true
    type: ClusterIP
  
  # Data storage 
  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: "/vault/data"
    storageClass: "nfs-storage"
    accessMode: ReadWriteOnce

ui:
  enabled: true
  serviceType: "ClusterIP"
  externalPort: 8200