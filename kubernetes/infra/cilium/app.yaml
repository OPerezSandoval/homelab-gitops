apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argo-gitops
  annotations:
    # CNI must reconcile before anything that needs pod networking.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.19.5
    helm:
      valuesObject:
        k8sServiceHost: 192.168.1.86
        k8sServicePort: 6443
        kubeProxyReplacement: true
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # Intentionally NO automated sync policy. Cilium is the CNI: an unexpected
  # prune or self-heal takes cluster networking down. Sync manually, review the
  # diff, and only turn on automation once adoption is proven clean.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
