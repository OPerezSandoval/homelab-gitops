apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argo-gitops
  annotations:
    # CNI must reconcile before anything that needs pod networking.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.19.5
      helm:
        valuesObject:
          # Pinned, NOT auto-detected. Cilium probes network devices and takes the
          # MINIMUM MTU across them. Once the Talos tailscale extension added a
          # tailscale0 interface (MTU 1280) to the node, Cilium attached to it --
          #   Devices: eno1 192.168.1.86 (Direct Routing), tailscale0 100.114.237.29
          # -- and dropped the cluster MTU from 1450 to 1280. Every pod inherited it.
          #
          # The damage is invisible in latency and brutal in throughput: the
          # tailscale ingress proxies run WireGuard INSIDE a 1280-MTU pod, so their
          # tunnel MTU shrinks again and path-MTU discovery breaks. Measured on
          # 2026-08-24: pings 20ms and healthy, while a 3.4MB asset over a DIRECT
          # LAN path took 48 SECONDS at 72KB/s.
          #
          # 1450 = eno1's 1500 minus 50 bytes of VXLAN overhead (routing-mode: tunnel).
          # Revisit if the physical NIC MTU changes or routing-mode moves to native.
          MTU: 1450

          k8sServiceHost: 192.168.1.86
          k8sServicePort: 6443
          kubeProxyReplacement: true
          operator:
            # Single node, and the operator binds a host port for health/metrics,
            # so a second replica can never schedule. Chart default is 2.
            replicas: 1
          hubble:
            relay:
              enabled: true
            ui:
              # Deliberately NOT using the chart's hubble.ui.ingress block: it
              # forces a host into the ingress rule, which does not match the
              # host-less shape that works with the tailscale ingress class here.
              # The Ingress is hand-written in extras/ instead, mirroring
              # kubernetes/infra/vault/extras/ui-ingress.yaml.
              enabled: true
            tls:
              auto:
                # Must not be the chart default ("helm"): that mints new certs on
                # every render, which reads as permanent drift to ArgoCD. "cronJob"
                # generates them in-cluster once and keeps them stable.
                method: cronJob
          securityContext:
            capabilities:
              ciliumAgent:
                - CHOWN
                - KILL
                - NET_ADMIN
                - NET_RAW
                - IPC_LOCK
                - SYS_ADMIN
                - SYS_RESOURCE
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
              cleanCiliumState:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
    - repoURL: https://github.com/OPerezSandoval/homelab-gitops.git
      targetRevision: main
      path: kubernetes/infra/cilium/extras
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # Intentionally NO automated sync policy. Cilium is the CNI: an unexpected
  # prune or self-heal takes cluster networking down. Sync manually, review the
  # diff, and only turn on automation once adoption is proven clean.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
