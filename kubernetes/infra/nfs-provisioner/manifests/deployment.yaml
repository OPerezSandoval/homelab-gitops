apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-subdir-external-provisioner
  namespace: nfs-provisioner
  labels:
    app: nfs-subdir-external-provisioner
spec:
  replicas: 1
  # Single leader-elected provisioner; never run two against the same export.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-subdir-external-provisioner
  template:
    metadata:
      labels:
        app: nfs-subdir-external-provisioner
    spec:
      serviceAccountName: nfs-subdir-external-provisioner
      containers:
        - name: nfs-subdir-external-provisioner
          image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
          volumeMounts:
            - name: nfs-client-root
              mountPath: /persistentvolumes
          env:
            # Must match the StorageClass `provisioner` and the
            # pv.kubernetes.io/provisioned-by on existing PVs. Do not change.
            - name: PROVISIONER_NAME
              value: pavillion-server/nfs
            - name: NFS_SERVER
              valueFrom:
                configMapKeyRef:
                  name: nfs-subdir-external-provisioner
                  key: NFS_SERVER
            - name: NFS_PATH
              valueFrom:
                configMapKeyRef:
                  name: nfs-subdir-external-provisioner
                  key: NFS_PATH
      volumes:
        - name: nfs-client-root
          nfs:
            server: 192.168.1.85
            path: /mnt/ssd/k8s
