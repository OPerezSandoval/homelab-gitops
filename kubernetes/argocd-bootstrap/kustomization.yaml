apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources rendered here land in argo-gitops. The upstream install manifest
# bakes namespace: argocd into every resource; this rewrites them.
namespace: argo-gitops

# Pin the ArgoCD version here. To upgrade: bump the v3.4.2 tag in the URL below,
# open a PR, merge. Application/argocd auto-syncs and rolls the upgrade in.
# Reference: https://github.com/argoproj/argo-cd/releases
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.2/manifests/install.yaml
  - cluster-admin-binding.yaml
  - argocd-ingress.yaml
  - oidc-external-secret.yaml

# Layer cluster-specific config onto the upstream argocd-cm / argocd-rbac-cm.
# target selectors match by kind+name so namespace rewriting doesn't matter.
patches:
  - path: argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-rbac-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
