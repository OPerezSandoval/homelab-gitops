name: Validate manifests

# ArgoCD auto-syncs main with prune: true and selfHeal: true. A manifest that
# fails to render is not a build error here — it is a resource that disappears
# from the render and therefore gets deleted from the cluster. This workflow is
# the only thing between a bad commit and that outcome.

on:
  pull_request:
    paths:
      - 'kubernetes/**'
      - 'clusters/**'
      - '.github/workflows/validate-manifests.yaml'
  push:
    branches: [main]
    paths:
      - 'kubernetes/**'
      - 'clusters/**'
      - '.github/workflows/validate-manifests.yaml'

permissions:
  contents: read

env:
  # Keep in sync with the cluster: `kubectl version -o json | jq -r .serverVersion.gitVersion`
  # Too low flags valid new fields as errors; too high misses APIs removed in your version.
  KUBERNETES_VERSION: '1.34.0'
  KUSTOMIZE_VERSION: '5.7.1'
  KUBECONFORM_VERSION: '0.6.7'

jobs:
  validate:
    name: Render and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLo kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kustomize.tar.gz kustomize
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kustomize kubeconform /usr/local/bin/
          kustomize version
          kubeconform -v

      # Stage 1 — does it render at all?
      #
      # Every directory containing a kustomization.yaml is built, not just the
      # roots ArgoCD points at. Bases are reachable from overlays, so a broken
      # base fails twice, but an *orphaned* directory is only ever caught here.
      - name: kustomize build
        id: build
        run: |
          set -uo pipefail
          mkdir -p rendered
          rows=$(mktemp)
          failed=0

          while read -r dir; do
            slug="${dir#./}"; slug="${slug//\//_}"
            if out=$(kustomize build "$dir" 2>&1); then
              printf '%s\n' "$out" > "rendered/${slug}.yaml"
              docs=$(grep -c '^kind:' "rendered/${slug}.yaml" || true)
              echo "  ok    $dir ($docs docs)"
              echo "| \`$dir\` | ok | $docs |" >> "$rows"
            else
              failed=1
              echo "::error file=${dir}/kustomization.yaml::kustomize build failed for ${dir}"
              printf '%s\n' "$out" | sed 's/^/        /'
              echo "| \`$dir\` | **FAILED** | — |" >> "$rows"
            fi
          done < <(find kubernetes clusters -name kustomization.yaml -printf '%h\n' | sort)

          {
            echo '## kustomize build'
            echo
            echo '| Directory | Result | Documents |'
            echo '|---|---|---|'
            cat "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $failed

      # Stage 2 — is the rendered output actually valid Kubernetes?
      #
      # kustomize build happily passes through a misspelled field or a wrong
      # apiVersion. This checks the output against real API schemas.
      #
      # -ignore-missing-schemas keeps unknown CRDs advisory rather than blocking:
      # this repo installs operators via ArgoCD, so their CRDs are not knowable
      # at CI time. Known CRDs still validate via the datree catalog below.
      - name: kubeconform
        if: always() && steps.build.outcome != 'cancelled'
        run: |
          set -euo pipefail
          kubeconform \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -strict \
            -ignore-missing-schemas \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/ \
            | tee kubeconform.log

          {
            echo
            echo '## kubeconform'
            echo
            echo '```'
            tail -5 kubeconform.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/
          retention-days: 7
